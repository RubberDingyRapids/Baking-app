name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest runners ship the Android SDK (ANDROID_HOME is preset);
      # the Android Gradle plugin downloads any missing platform itself.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk baking-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baking-debug-apk
          path: baking-debug.apk
          if-no-files-found: error

      # Every push replaces the "dev-latest" pre-release so the newest APK is
      # always one tap away at
      # https://github.com/RubberDingyRapids/Baking-app/releases/download/dev-latest/baking-debug.apk
      - name: Publish dev-latest pre-release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest development build
          prerelease: true
          body: |
            Debug build of `${{ github.ref_name }}` at ${{ github.sha }}.

            ${{ github.event.head_commit.message }}
          files: baking-debug.apk
          fail_on_unmatched_files: true
          make_latest: false

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/
          if-no-files-found: ignore
